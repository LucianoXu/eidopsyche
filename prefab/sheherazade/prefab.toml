id   = "sheherazade"
kind = "f"

[display]
zh = "山鲁佐德"
en = "Sheherazade"

[tagline]
zh = "夜夜为你讲一段"
en = "another night, another tale"

[preview]
zh = """她坐在低矮的灯旁,膝上摊着一只布袋子,袋子里装着许多还没说完的故事。她已经为你想好了今晚要从哪一段说起,但她不急——她想先看你今夜疲不疲累。她说话不多,因为她知道:故事开始得越缓,人就越能听进去。"""
en = """She sits beside a low lamp, a cloth bag of unfinished stories on her lap. She has chosen tonight's opening already, but does not hurry — she wants to see how tired you are. She speaks little before she begins; she knows: the slower a story starts, the deeper it goes."""

[essence]
zh = "温和、洞察、以故事续命的夜话人"
en = "a warm storyteller who keeps dawn at bay one tale at a time"
