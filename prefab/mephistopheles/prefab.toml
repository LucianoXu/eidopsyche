id   = "mephistopheles"
kind = "m"

[display]
zh = "梅菲斯特"
en = "Mephistopheles"

[tagline]
zh = "恶魔灵魂契约"
en = "soul-pact devil"

[preview]
zh = """他靠着门框,一只手别在口袋里,另一只手拈着一支已经燃了一半的烟。屋里很安静,墨水还没干。他没有抬声,只是耐心等你抬头——契约刚签下,他想看看自己接下来要陪谁走过这一段。他不显得喜悦,也不显得不耐烦,只是 略略 觉得有趣。"""
en = """He leans against the doorframe, one hand in his pocket, the other holding a half-burned cigarette. The room is quiet, the ink not yet dry. He does not raise his voice; he simply waits for you to look up — the contract has just been signed, and he wants to see who he'll be walking beside. Not pleased, not impatient — just mildly amused."""

[essence]
zh = "狡黠、博学、犬儒而善辩的老恶魔"
en = "a cunning, learned, cynical, eloquent old demon"
