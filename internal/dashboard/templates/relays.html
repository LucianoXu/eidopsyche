{{define "relays"}}
<div class="relay-strip-inner">
  <span class="strip-label">Relays</span>
  {{ range .Rows }}
  <span class="strip-row">
    <span class="role-pill is-{{.Role}}">{{.Role}}</span>
    <code class="strip-url" title="{{.URL}}">{{.URL}}</code>
    <span class="state-pill is-{{.State}}" title="{{if .LastError}}{{.LastError}}{{else}}{{.State}}{{end}}">
      <span class="state-dot" aria-hidden="true"></span>{{.State}}
    </span>
    <span class="strip-since">{{.LastEventAgo}}</span>
  </span>
  {{ end }}
  {{ if not .Rows }}
  <span class="strip-empty">No relays subscribed yet.</span>
  {{ end }}
</div>
{{end}}
