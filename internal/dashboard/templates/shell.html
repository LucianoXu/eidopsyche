{{define "shell"}}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1024">
<title>eidos-gate · {{.OwnLabel}}</title>
<link rel="stylesheet" href="/static/app.css">
<script src="/static/htmx.min.js"></script>
<script src="/static/htmx-ext-sse.js"></script>
</head>
<body hx-ext="sse" sse-connect="/events">
<header class="topbar" id="topbar"
        hx-get="/topbar"
        hx-trigger="sse:identity.label-changed from:body"
        hx-swap="innerHTML">
  {{template "topbar_inner" .}}
</header>
<main class="layout">
  <aside class="sidebar" id="sidebar"
         hx-get="/sidebar/contacts"
         hx-trigger="sse:contact.added,sse:contact.removed,sse:contact.relabeled,sse:contact.tier-changed">
    {{template "sidebar-inner" .Sidebar}}
  </aside>
  <section class="main" id="main">
    {{.Main}}
  </section>
</main>
<footer class="relays-strip" id="relays-strip"
        hx-get="/relays"
        hx-trigger="load, sse:relay.state from:body"
        hx-swap="innerHTML"></footer>
<div id="modal"></div>
<!--
  Toast region. The inline script below catches every htmx request that
  fails (HTTP 4xx/5xx via htmx:responseError) and every network-level
  error (htmx:sendError — daemon unreachable, IPC drop). Without this,
  htmx 2.x silently drops the response on any non-2xx status: the
  operator clicks Send / Remove / Revoke and gets no visible feedback
  even though the daemon has logged a failure. Bug found post-v0.7.0
  when a stale-relay send returned 502 with `<div class="error">…</div>`
  and nothing rendered.
-->
<div id="toasts" class="toasts" role="status" aria-live="polite" aria-atomic="false"></div>
<script>
  (function () {
    var ERR_LIFETIME_MS  = 8000;
    var INFO_LIFETIME_MS = 4000;
    // Anchor at the path start so /settings/relays* user-initiated
    // submits don't get swallowed alongside the /relays background poll.
    // See PR #14 review — the unanchored form re-introduced the very
    // silent-drop class this PR exists to fix, in the relay-management
    // surface.
    var BUSY_PATH_RE     = /^\/(events|relays|topbar|sidebar\/)/;
    function toastMessage(xhr) {
      var t = (xhr && xhr.responseText) || "";
      // The body is usually a small HTML fragment or plain text; strip
      // tags for the toast (we only want the human message). For empty
      // bodies fall back to the status line.
      var stripped = t.replace(/<[^>]+>/g, "").trim();
      if (stripped) return stripped;
      return "HTTP " + (xhr && xhr.status || "0");
    }
    function showToast(text, kind) {
      var host = document.getElementById("toasts");
      if (!host) return;
      var el = document.createElement("div");
      el.className = "toast is-" + (kind || "info");
      // role="alert" forces an assertive screen-reader announcement;
      // reserve it for errors so an info toast stays polite (and doesn't
      // contradict the parent #toasts region's aria-live=polite).
      if (kind === "error") el.setAttribute("role", "alert");
      el.textContent = text;
      el.addEventListener("click", function () { el.remove(); });
      host.appendChild(el);
      var ttl = (kind === "error") ? ERR_LIFETIME_MS : INFO_LIFETIME_MS;
      setTimeout(function () { el.classList.add("is-fading"); }, ttl - 600);
      setTimeout(function () { el.remove(); }, ttl);
    }
    document.body.addEventListener("htmx:responseError", function (evt) {
      // Skip background polls that the operator didn't initiate — a
      // momentary 5xx on the relays panel SSE refresh shouldn't interrupt
      // the foreground.
      var path = evt.detail && evt.detail.requestConfig && evt.detail.requestConfig.path || "";
      if (BUSY_PATH_RE.test(path)) return;
      showToast(toastMessage(evt.detail.xhr), "error");
    });
    document.body.addEventListener("htmx:sendError", function () {
      showToast("Network error — could not reach the daemon. Reload to retry.", "error");
    });
    // Expose for use from inline hx-on:: handlers when a handler wants
    // to surface its own success / info message.
    window.eidosToast = showToast;
  })();

  // OOB swap shim for htmx-ext-sse.
  //
  // htmx-ext-sse (v2.2.2) calls htmx's low-level swap which does process
  // `hx-swap-oob` — but only for elements that already exist in the
  // document. For tier-2 acks the SSE event commonly arrives BEFORE the
  // POST /thread/{pubkey}/send response has inserted the initial bubble
  // (the daemon emits the ack-update before the HTTP handler returns the
  // bubble HTML to the browser). The OOB target therefore doesn't exist
  // yet, htmx drops the element, and the bubble never flips ✓ → ✓✓.
  //
  // Fix: intercept `htmx:sseBeforeMessage`, identify single-root OOB
  // bubbles, and queue them by id. Try to apply now; otherwise replay
  // after the next htmx swap finishes (which is when the POST response
  // bubble lands in the DOM). Always preventDefault so the queued OOB
  // never gets duplicated by the default beforeend swap.
  //
  // Note: htmx-ext-sse passes the raw SSE Event as `evt.detail` (see
  // its `triggerEvent(elt, 'htmx:sseBeforeMessage', event)` call), so
  // the data lives at `evt.detail.data` — not `evt.detail.event.data`.
  (function () {
    var pending = new Map(); // id → bubble HTML waiting for its target

    function applyOOB(id) {
      var html = pending.get(id);
      if (!html) return false;
      var existing = document.getElementById(id);
      if (!existing) return false;
      var tmpl = document.createElement("template");
      tmpl.innerHTML = html.trim();
      var root = tmpl.content.firstElementChild;
      if (!root) {
        pending.delete(id);
        return false;
      }
      existing.replaceWith(root);
      pending.delete(id);
      return true;
    }

    function flushPending() {
      if (pending.size === 0) return;
      // Iterate over a snapshot so deletions during iteration are safe.
      var ids = Array.from(pending.keys());
      for (var i = 0; i < ids.length; i++) {
        applyOOB(ids[i]);
      }
    }

    document.body.addEventListener("htmx:sseBeforeMessage", function (evt) {
      var data = evt.detail && evt.detail.data;
      if (typeof data !== "string" || data.length === 0) return;
      var tmpl = document.createElement("template");
      tmpl.innerHTML = data.trim();
      var root = tmpl.content.firstElementChild;
      if (!root || tmpl.content.children.length !== 1) return;
      if (!root.hasAttribute("hx-swap-oob")) return;
      var id = root.getAttribute("id");
      if (!id) return;
      // Suppress the default sse-swap so the OOB element isn't appended;
      // we own the swap from this point.
      evt.preventDefault();
      pending.set(id, data);
      applyOOB(id);
    });

    // Re-try pending OOB swaps after each htmx swap. The POST /send
    // response is delivered through the standard htmx swap pipeline, so
    // its `htmx:afterSwap` is exactly when the matching bubble appears
    // in the DOM.
    document.body.addEventListener("htmx:afterSwap", flushPending);
  })();
</script>
</body>
</html>{{end}}
