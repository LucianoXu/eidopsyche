name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # create GitHub Release, upload assets
  packages: write   # push to ghcr.io (reserved; docker images are deferred)
  id-token: write   # reserved for future cosign keyless signing

jobs:
  release:
    name: GoReleaser
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history is required for changelog generation

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # Self-hosted runners persist Go's caches across jobs; uploading
          # them to GitHub's cache service is wasted bandwidth. See ci.yml.
          cache: false

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  mindform-image:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push mind-form image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/mindform/Dockerfile
          push: true
          build-args: |
            EIDOS_VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/lucianoxu/eidopsyche-mindform:${{ github.ref_name }}
            ghcr.io/lucianoxu/eidopsyche-mindform:latest
