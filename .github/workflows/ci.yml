name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, vet, staticcheck, unit & integration tests
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # Self-hosted runners have persistent disk; Go's local module/build
          # caches survive between jobs. Uploading them to GitHub's cache
          # service ("Post Set up Go" step) is pure overhead — we measured
          # 314s on the cross-compile job for a build that took 1s. Disable.
          cache: false

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "the following files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: staticcheck
        run: $(go env GOPATH)/bin/staticcheck ./...

      - name: Unit tests
        run: go test ./...

      - name: Integration tests
        run: go test -tags=integration ./test/integration/...

      - name: Build
        run: go build -o /tmp/eidos ./cmd/eidos

  cross-build:
    name: Cross-compile (snapshot)
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # Self-hosted runners have persistent disk; Go's local module/build
          # caches survive between jobs. Uploading them to GitHub's cache
          # service ("Post Set up Go" step) is pure overhead — we measured
          # 314s on the cross-compile job for a build that took 1s. Disable.
          cache: false

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          install-only: true
          version: latest

      - name: Snapshot build
        run: goreleaser release --snapshot --clean --skip=publish
